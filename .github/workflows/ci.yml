name: Windows validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate Skill structure
        run: python tools/validate-skill.py skill/pc-hardware-workbench

      - name: Check Skill and portable script sync
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\check-portable-sync.ps1
          exit $LASTEXITCODE

      - name: Run non-live Skill tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\skill\pc-hardware-workbench\tests\run-all-tests.ps1 `
            -SkillRoot .\skill\pc-hardware-workbench
          exit $LASTEXITCODE

      - name: Run portable self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\portable\start.ps1 -SelfTest
          exit $LASTEXITCODE

      - name: Reject trailing whitespace in shipped trees
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $hits = git grep -nIE '[[:blank:]]+$' -- skill portable tools
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $hits
            throw 'Trailing whitespace found in shipped trees.'
          }
          if ($exitCode -ne 1) {
            throw "git grep failed with exit code $exitCode."
          }
          'OK: no trailing whitespace in skill/, portable/, tools/'
