<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="电脑硬件工作台 Skill 2.7.0 文件星球，共 113 个文件">
  <link rel="icon" href="data:,">
  <title>文件星球 · Skill 2.7.0</title>
  <style>
    :root {
      --void: #07090c;
      --surface: #0d1116;
      --surface-2: #111820;
      --paper: #e7edf2;
      --muted: #8e9aa7;
      --line: #202a35;
      --line-soft: rgba(139, 167, 191, .15);
      --cyan: #7dd3e8;
      --amber: #e6b36e;
      --rose: #d99ab7;
      --leaf: #b3d89a;
      --blue: #7f9dff;
      --rust: #e78f73;
      --core: #eef4f7;
      --radius: 18px;
      --motion-ease: cubic-bezier(.2, 0, 0, 1);
      --motion-page-exit: 140ms;
      --motion-page-enter: 240ms;
    }

    @view-transition {
      navigation: auto;
    }

    ::view-transition-old(root) {
      animation: orrery-view-out var(--motion-page-exit) cubic-bezier(.4, 0, 1, 1) both;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: orrery-view-in var(--motion-page-enter) var(--motion-ease) both;
      mix-blend-mode: normal;
    }

    @keyframes orrery-view-out {
      to {
        opacity: 0;
      }
    }

    @keyframes orrery-view-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--void);
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 48% 48%, rgba(39, 71, 88, .15), transparent 36%),
        radial-gradient(circle at 78% 20%, rgba(85, 51, 76, .08), transparent 24%),
        linear-gradient(180deg, #05070a 0%, #020406 62%, #010203 100%);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      opacity: .45;
      background-image:
        radial-gradient(circle, rgba(219, 236, 248, .72) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(165, 204, 225, .5) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 255, 255, .38) 0 .8px, transparent 1.4px);
      background-position: 17px 31px, 73px 109px, 131px 53px;
      background-size: 173px 191px, 251px 233px, 307px 269px;
      mask-image: radial-gradient(ellipse at 48% 46%, #000 8%, rgba(0, 0, 0, .72) 58%, transparent 92%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1760px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 18px 22px 22px;
    }

    .global-nav {
      position: sticky;
      top: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      padding: 0 2px;
      color: var(--muted);
      background: rgba(5, 7, 10, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .global-nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: #c8d0d7;
      font-size: 13px;
      text-decoration: none;
    }

    .global-nav a:hover,
    .global-nav a:focus-visible {
      color: var(--paper);
    }

    .global-nav span {
      font-size: 12px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 64px;
      padding: 0 2px 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(125, 211, 232, .46);
      border-radius: 50%;
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      content: "";
      border-radius: 50%;
    }

    .brand-mark::before {
      inset: 7px;
      border: 1px solid rgba(231, 237, 242, .7);
    }

    .brand-mark::after {
      top: 4px;
      left: 50%;
      width: 7px;
      height: 7px;
      background: var(--cyan);
      box-shadow: 0 0 14px rgba(125, 211, 232, .8);
      transform: translateX(-50%);
    }

    .brand h1 {
      margin: 0;
      color: var(--paper);
      font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: clamp(24px, 2.2vw, 34px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.05;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .header-stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .header-stats span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .header-stats a {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      color: var(--muted);
      text-decoration: none;
    }

    .header-stats a:hover {
      color: var(--paper);
    }

    .snapshot-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 12px;
      padding: 11px 14px;
      color: #aeb9c2;
      border: 1px solid rgba(230, 179, 110, .25);
      border-radius: 10px;
      background: rgba(35, 27, 17, .36);
      font-size: 12px;
      line-height: 1.6;
    }

    .snapshot-banner strong {
      color: var(--amber);
      font-weight: 560;
    }

    .snapshot-banner a {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      color: var(--paper);
      text-decoration: none;
      border-bottom: 1px solid #536170;
    }

    .header-stats span::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      opacity: .6;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(350px, 400px);
      gap: 12px;
      height: clamp(620px, calc(100svh - 210px), 900px);
      padding-top: 12px;
    }

    .stage-shell {
      position: relative;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(118, 149, 173, .09);
      border-radius: var(--radius);
      background:
        radial-gradient(ellipse at 50% 48%, rgba(30, 58, 74, .13), transparent 35%),
        radial-gradient(ellipse at 72% 78%, rgba(65, 40, 57, .055), transparent 30%),
        linear-gradient(180deg, rgba(5, 8, 11, .98), rgba(2, 4, 7, .99));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .025),
        0 22px 70px rgba(0, 0, 0, .28);
    }

    .stage-shell::before {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      content: "";
      background:
        radial-gradient(ellipse at 50% 47%, transparent 32%, rgba(1, 3, 5, .18) 67%, rgba(0, 1, 2, .64) 100%),
        linear-gradient(180deg, rgba(4, 7, 10, .28), transparent 16%, transparent 82%, rgba(2, 4, 6, .42));
      mask-image: linear-gradient(180deg, #000 0%, #000 90%, transparent 100%);
    }

    .stage-toolbar {
      position: absolute;
      top: 14px;
      right: 16px;
      left: 16px;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-family: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      pointer-events: auto;
    }

    .breadcrumb button {
      min-height: 32px;
      margin-left: -7px;
      padding: 4px 7px;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    .breadcrumb button:hover {
      color: var(--paper);
    }

    .breadcrumb span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .crumb-separator {
      flex: 0 0 auto;
      color: #566474;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .motion-toggle,
    .back-button,
    .selection-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(9, 13, 18, .74);
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .motion-toggle:hover,
    .back-button:hover,
    .selection-reset:hover {
      border-color: #344557;
      color: var(--paper);
    }

    .motion-toggle::before {
      width: 6px;
      height: 6px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 9px rgba(125, 211, 232, .7);
      content: "";
    }

    .motion-toggle[aria-pressed="false"]::before {
      background: #5e6874;
      box-shadow: none;
    }

    .back-button,
    .selection-reset {
      display: none;
      padding-inline: 8px;
      font-size: 12px;
    }

    .back-button.is-visible,
    .selection-reset.is-visible {
      display: inline-flex;
    }

    .stage {
      position: absolute;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
    }

    .scene-lines,
    .node-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene-lines {
      overflow: visible;
      pointer-events: none;
    }

    .scene-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .orbit-line {
      fill: none;
      stroke: var(--line-soft);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      transition: opacity .25s ease, stroke-width .25s ease;
    }

    .orbit-line.is-dashed {
      stroke-dasharray: 2 10;
      opacity: .65;
    }

    .orbit-tick {
      stroke: rgba(138, 166, 187, .22);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .orbit-axis {
      stroke: rgba(138, 166, 187, .08);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .orbital-plane {
      fill: rgba(31, 58, 75, .09);
      stroke: rgba(116, 151, 174, .12);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .stage.is-dragging {
      cursor: grabbing;
    }

    .stage.is-rolling {
      cursor: ew-resize;
    }

    .category-orbit {
      opacity: .21;
      stroke-width: .95;
      stroke-dasharray: none;
    }

    .category-orbit.is-hot {
      opacity: .42;
      stroke-width: 1.15;
      stroke-dasharray: none;
    }

    .orbit-trail {
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      opacity: .72;
      filter: drop-shadow(0 0 3px currentColor);
    }

    .orbit-trail.is-hot {
      stroke-width: 2.2;
      opacity: 1;
    }

    .star-dot {
      fill: #c9d9e6;
      opacity: .22;
    }

    .link-line {
      stroke: var(--cyan);
      stroke-width: 1.1;
      stroke-dasharray: 4 8;
      opacity: .6;
      vector-effect: non-scaling-stroke;
      animation: dashFlow 8s linear infinite;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -48;
      }
    }

    .core-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(21vw, 214px);
      height: min(21vw, 214px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167, 215, 224, .08), rgba(70, 101, 121, .02) 48%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .core-aura::after {
      position: absolute;
      inset: 13%;
      border: 1px solid rgba(125, 211, 232, .08);
      border-radius: 50%;
      content: "";
    }

    .category-node,
    .file-node {
      position: absolute;
      display: grid;
      justify-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
    }

    .category-node {
      z-index: 4;
      place-items: center;
      width: 44px;
      min-height: 44px;
      transition: opacity .35s ease, transform .16s ease-out;
      overflow: visible;
    }

    .category-node:not(.is-core) .category-sphere::after {
      position: absolute;
      inset: -16%;
      border: 1px solid color-mix(in srgb, var(--group-color) 44%, transparent);
      border-radius: 50%;
      content: "";
      opacity: .46;
      pointer-events: none;
      transform: rotate(-17deg) scaleY(.25);
      box-shadow: 0 0 8px color-mix(in srgb, var(--group-color) 12%, transparent);
    }

    .category-sphere {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--diameter, 46px);
      height: var(--diameter, 46px);
      border: 1px solid color-mix(in srgb, var(--group-color) 44%, transparent);
      border-radius: 50%;
      color: var(--group-color);
      background: #080e14;
      box-shadow:
        0 0 0 4px color-mix(in srgb, var(--group-color) 4%, transparent),
        0 0 15px color-mix(in srgb, var(--group-color) 10%, transparent);
      transform: scale(var(--planet-scale, 1));
      transition:
        transform .32s cubic-bezier(.2, .8, .2, 1),
        scale .32s cubic-bezier(.2, .8, .2, 1),
        box-shadow .32s ease,
        border-color .32s ease;
      overflow: visible;
    }

    .category-sphere::before,
    .file-sphere::before {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      background: radial-gradient(circle, transparent 56%, rgba(0, 0, 0, .08) 78%, rgba(0, 0, 0, .46) 100%);
      box-shadow: inset 0 0 6px rgba(0, 0, 0, .34);
      content: "";
      pointer-events: none;
    }

    .category-node.is-core .category-sphere::before {
      background: radial-gradient(circle, transparent 54%, rgba(4, 16, 22, .1) 76%, rgba(1, 5, 8, .48) 100%);
    }

    .planet-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .category-node:hover .category-sphere,
    .category-node:focus-visible .category-sphere {
      border-color: color-mix(in srgb, var(--group-color) 85%, white 8%);
      box-shadow:
        0 0 0 6px color-mix(in srgb, var(--group-color) 7%, transparent),
        0 0 24px color-mix(in srgb, var(--group-color) 20%, transparent);
      transform: scale(var(--planet-scale, 1));
      scale: 1.16;
    }

    .category-count {
      font-family: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .category-label {
      position: absolute;
      top: calc(50% + var(--planet-span, var(--diameter, 46px)) / 2 + 8px);
      left: 50%;
      display: grid;
      justify-items: center;
      gap: 0;
      color: var(--muted);
      text-align: center;
      line-height: 1.2;
      opacity: .68;
      transform: translateX(-50%);
      transition: opacity .18s ease;
      white-space: nowrap;
      pointer-events: none;
    }

    .category-label::before {
      position: absolute;
      top: -7px;
      left: 50%;
      width: 1px;
      height: 5px;
      background: var(--group-color);
      content: "";
      transform: translateX(-50%);
      opacity: .4;
    }

    .category-label strong {
      color: color-mix(in srgb, var(--group-color) 38%, #78848e 62%);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .category-label small {
      color: var(--muted);
      font-family: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
      font-size: 10px;
    }

    .category-node.is-core {
      z-index: 6;
      width: 44px;
    }

    .category-node.is-core .category-sphere {
      width: var(--diameter, 42px);
      height: var(--diameter, 42px);
      color: var(--paper);
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .78), transparent 13%),
        radial-gradient(circle at 42% 44%, rgba(125, 211, 232, .52), rgba(25, 37, 47, .9) 44%, #0b1116 74%);
      box-shadow:
        0 0 0 6px rgba(125, 211, 232, .025),
        0 0 22px rgba(125, 211, 232, .18),
        0 0 52px rgba(125, 211, 232, .055);
    }

    .category-node.is-core .category-label {
      top: calc(50% + var(--planet-span, var(--diameter, 42px)) / 2 + 12px);
      right: auto;
      left: 50%;
      justify-items: center;
      text-align: center;
      transform: translateX(-50%);
    }

    .category-node.is-core .category-label::before {
      top: -9px;
      left: 50%;
      width: 1px;
      height: 6px;
      transform: translateX(-50%);
    }

    .category-node.is-core .category-label strong {
      color: #9ba7b0;
      font-size: 12px;
    }

    .category-node:hover .category-label,
    .category-node:focus-visible .category-label {
      opacity: 1;
    }

    .category-node:hover .category-label strong,
    .category-node:focus-visible .category-label strong {
      color: var(--paper);
    }

    .category-node:hover .category-label small,
    .category-node:focus-visible .category-label small {
      color: #aeb9c2;
    }

    .category-node:hover .category-label::before,
    .category-node:focus-visible .category-label::before {
      opacity: .9;
    }

    .sector-title {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      display: none;
      width: 190px;
      height: 176px;
      color: var(--paper);
      text-align: center;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .sector-title.is-visible {
      display: grid;
    }

    .sector-title::before {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      border: 1px solid color-mix(in srgb, var(--sector-color) 36%, transparent);
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--sector-color) 16%, transparent), transparent 68%);
      content: "";
      transform: translate(-50%, -50%) scale(var(--sector-scale, 1));
    }

    .sector-planet {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      box-shadow:
        0 0 0 5px color-mix(in srgb, var(--sector-color) 4%, transparent),
        0 0 30px color-mix(in srgb, var(--sector-color) 18%, transparent);
      transform: translate(-50%, -50%) scale(var(--sector-scale, 1));
    }

    .sector-planet::after {
      position: absolute;
      inset: -12px;
      border: 1px solid color-mix(in srgb, var(--sector-color) 24%, transparent);
      border-radius: 50%;
      content: "";
      transform: rotate(-14deg) scaleY(.38);
    }

    .sector-title strong {
      position: absolute;
      top: calc(50% + 42px);
      left: 50%;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .sector-title .sector-folder {
      position: absolute;
      top: calc(50% + 60px);
      left: 50%;
      color: var(--sector-color);
      font-family: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
      font-size: 10px;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .sector-title small {
      position: absolute;
      top: calc(50% + 76px);
      left: 50%;
      color: var(--muted);
      font-size: 10px;
      transform: translateX(-50%);
    }

    .file-node {
      z-index: 5;
      width: 44px;
      min-height: 44px;
      align-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .13s ease-out;
    }

    .file-node.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .file-node .node-body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      min-height: 44px;
    }

    .file-sphere {
      position: relative;
      flex: 0 0 var(--file-size, 12px);
      width: var(--file-size, 12px);
      height: var(--file-size, 12px);
      border: 1px solid color-mix(in srgb, var(--file-color) 75%, white 8%);
      border-radius: 50%;
      background: #091016;
      box-shadow: 0 0 13px color-mix(in srgb, var(--file-color) 24%, transparent);
      transform: scale(var(--planet-scale, 1));
      transition:
        transform .2s cubic-bezier(.2, .8, .2, 1),
        scale .2s cubic-bezier(.2, .8, .2, 1),

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function hashSeed(value) {
      let hash = 2166136261;
      for (const char of String(value)) {
        hash ^= char.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function hexToRgb(hex) {
      const normalized = String(hex).replace("#", "");
      return {
        r: Number.parseInt(normalized.slice(0, 2), 16),
        g: Number.parseInt(normalized.slice(2, 4), 16),
        b: Number.parseInt(normalized.slice(4, 6), 16)
      };
    }

    function weightToDiameter(value, minimum, maximum, minimumSize, maximumSize) {
      if (maximum <= minimum) return (minimumSize + maximumSize) / 2;
      const ratio = clamp((value - minimum) / (maximum - minimum), 0, 1);
      return minimumSize + (maximumSize - minimumSize) * ratio;
    }

    function paintPlanet(canvas, color, seedValue, central = false, weight = 1) {
      if (!canvas) return;
      const seed = seedValue % 997;
      let duration = central
        ? 96 + seed % 61
        : 56 + (seed * 11 + Math.round(weight * 100) * 7) % 71;
      const usedDurations = new Set(
        [...document.querySelectorAll(".planet-canvas[data-rotation-period]")]
          .filter(other => other !== canvas)
          .map(other => Number(other.dataset.rotationPeriod))
      );
      while (usedDurations.has(duration)) duration += 1;
      const direction = seed % 3 === 0 ? -1 : 1;
      canvas.dataset.rotationPeriod = duration.toFixed(1);
      canvas.dataset.rotationDirection = direction < 0 ? "reverse" : "forward";
      canvas.dataset.weight = weight.toFixed(2);
      planetMeta.set(canvas, {
        color,
        base: hexToRgb(color),
        seed,
        central,
        duration,
        direction,
        phase: seed * .017 + weight * .31
      });
      renderPlanetCanvas(canvas);
    }

    function renderPlanetCanvas(canvas) {
      const meta = planetMeta.get(canvas);
      if (!meta) return;

      const context = canvas.getContext("2d");
      const size = canvas.width;
      const center = size / 2;
      const radius = size * .445;
      let image = planetImages.get(canvas);
      if (!image || image.width !== size || image.height !== size) {
        image = context.createImageData(size, size);
        planetImages.set(canvas, image);
      }
      const spin = meta.phase +
        state.planetTime * meta.direction * Math.PI * 2 / meta.duration;
      const cosSpin = Math.cos(spin);
      const sinSpin = Math.sin(spin);
      const cosYaw = Math.cos(state.cameraYaw);
      const sinYaw = Math.sin(state.cameraYaw);
      const cosPitch = Math.cos(state.cameraPitch);
      const sinPitch = Math.sin(state.cameraPitch);
      const cosRoll = Math.cos(state.cameraRoll);
      const sinRoll = Math.sin(state.cameraRoll);
      const light = { x: -.58, y: -.55, z: .6 };

      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const index = (y * size + x) * 4;
          const viewX = (x - center) / radius;
          const viewY = (y - center) / radius;
          const distanceSquared = viewX * viewX + viewY * viewY;
          if (distanceSquared > 1) continue;

          const viewZ = Math.sqrt(Math.max(0, 1 - distanceSquared));
          const rolledX = viewX * cosRoll + viewY * sinRoll;
          const rolledY = -viewX * sinRoll + viewY * cosRoll;
          const worldY = rolledY * cosPitch + viewZ * sinPitch;
          const pitchedZ = -rolledY * sinPitch + viewZ * cosPitch;
          const worldX = rolledX * cosYaw + pitchedZ * sinYaw;
          const worldZ = -rolledX * sinYaw + pitchedZ * cosYaw;
          const localX = worldX * cosSpin + worldZ * sinSpin;
          const localZ = -worldX * sinSpin + worldZ * cosSpin;
          const latitude = Math.asin(clamp(worldY, -1, 1));
          const longitude = Math.atan2(localZ, localX);

          const bands =
            Math.sin(latitude * 10 + meta.seed * .05) * .08 +
            Math.sin(longitude * 3 + latitude * 5 + meta.seed * .03) * .06 +
            Math.sin(longitude * 9 - latitude * 2 + meta.seed * .07) * .03;
          const turbulence =
            Math.sin(longitude * 5 + latitude * 7 + meta.seed * .011) *
            Math.sin(latitude * 13 - meta.seed * .02) * .04;
          const diffuse = Math.max(
            0,
            viewX * light.x + viewY * light.y + viewZ * light.z
          );
          const highlight = Math.pow(diffuse, 18) * .15;
          const limb = Math.pow(1 - viewZ, 2) * .16;
          const intensity = clamp(
            (meta.central ? 1.12 : .88 + bands + turbulence) *
              (.4 + diffuse * .78) + highlight + limb,
            .1,
            1.4
          );

          image.data[index] = Math.min(255, meta.base.r * intensity);
          image.data[index + 1] = Math.min(255, meta.base.g * intensity);
          image.data[index + 2] = Math.min(255, meta.base.b * intensity);
          image.data[index + 3] = Math.round(
            255 * Math.min(1, (1 - Math.sqrt(distanceSquared)) * 18)
          );
        }
      }
      context.putImageData(image, 0, 0);

      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.strokeStyle = `rgba(${Math.min(255, meta.base.r + 70)},${Math.min(255, meta.base.g + 70)},${Math.min(255, meta.base.b + 70)},${meta.central ? .56 : .3})`;
      context.lineWidth = meta.central ? 1.5 : 1;
      context.shadowBlur = meta.central ? 10 : 4;
      context.shadowColor = meta.color;
      context.stroke();
      context.shadowBlur = 0;
    }

    function renderVisiblePlanets(force = false) {
      if (state.reducedMotion && !force) return;
      const timestamp = performance.now();
      if (!force && timestamp - state.lastPlanetFrame < PLANET_TEXTURE_FRAME_MS) return;
      state.lastPlanetFrame = timestamp;
      document.querySelectorAll(".planet-canvas").forEach(canvas => {
        if (!planetMeta.has(canvas)) return;
        if (canvas.closest("#orbitLayer") && state.group) return;
        if (canvas.closest("#fileLayer") && !state.group) return;
        if (canvas.closest("#sectorTitle") && !state.group) return;
        renderPlanetCanvas(canvas);
      });
    }

      core.addEventListener("pointerenter", () => { state.paused = true; });
      core.addEventListener("pointerleave", () => { state.paused = false; });
      core.addEventListener("focus", () => { state.paused = true; });
      core.addEventListener("blur", () => { state.paused = false; });

      buildSectorRail();
    }

    function buildSectorRail() {
      sectorRail.innerHTML = "";
      Object.entries(GROUPS).forEach(([id, group]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.group = id;
        button.style.setProperty("--rail-color", group.color);
        button.textContent = `${group.name} ${FILES_BY_GROUP[id].length}`;
        button.addEventListener("click", () => openGroup(id));
        sectorRail.appendChild(button);
      });
    }

    function setOrbitHighlight(groupId, active) {
      (state.categoryOrbitPaths.get(groupId) || []).forEach(orbit => {
        orbit.classList.toggle("is-hot", active || state.group === groupId);
      });
    }

    function updateSectorRail() {
      sectorRail.querySelectorAll("button").forEach(button => {
        button.classList.toggle("is-active", button.dataset.group === state.group);
      });
    }

    function measure() {
      const rect = stage.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const centerX = width * .5;
      const centerY = height * .5;
      const maxRadius = Math.max(
        104,
        Math.min(width * .46, height * .5)
      );
      const ringRadii = [0, maxRadius * .31, maxRadius * .54, maxRadius * .74, maxRadius * .91];
      state.layout = { width, height, centerX, centerY, maxRadius, ringRadii };
      drawScene();
      positionCategories();
      if (state.group) {
        positionLocalFiles();
      }
    }

    function svgElement(name, attrs = {}) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function createSceneLayers(width, height) {
      sceneLines.innerHTML = "";
      state.categoryOrbitPaths.clear();
      state.localOrbitPaths = [];
      state.sceneLayers = Array.from({ length: DEPTH_LAYER_COUNT }, (_, index) => {
        const layer = svgElement("svg", {
          class: "scene-layer",
          viewBox: `0 0 ${width} ${height}`,
          "aria-hidden": "true",
          "data-depth-layer": index
        });
        layer.style.zIndex = String(DEPTH_Z_INDEX_BASE + index);
        sceneLines.appendChild(layer);
        return layer;
      });
      return state.sceneLayers;
    }

    function sceneDepthRange(radius) {
      return Math.max(radius * 1.45, 180);
    }

    function depthLayerIndex(z, range) {
      const normalized = clamp((z + range) / (range * 2), 0, .999999);
      return Math.floor((1 - normalized) * DEPTH_LAYER_COUNT);
    }

    function depthZIndex(z, range) {
      return DEPTH_Z_INDEX_BASE + depthLayerIndex(z, range);
    }

    function createLayeredOrbitPaths(className, dataAttribute, dataValue, color) {
      return state.sceneLayers.map((layer, index) => {
        const path = svgElement("path", {
          class: `orbit-line ${className}`,
          [dataAttribute]: dataValue,
          "data-depth-layer": index
        });
        path.style.stroke = color;
        layer.appendChild(path);
        return path;
      });
    }

    function projectedLayeredPaths(sampler, startAngle, endAngle, steps, range) {
      const commands = Array.from({ length: DEPTH_LAYER_COUNT }, () => []);
      let previous = sampler(startAngle);
      let previousLayer = -1;
      for (let index = 1; index <= steps; index += 1) {
        const angle = startAngle + (endAngle - startAngle) * index / steps;
        const point = sampler(angle);
        const layerIndex = depthLayerIndex((previous.z + point.z) * .5, range);
        const start = `${previous.x.toFixed(2)} ${previous.y.toFixed(2)}`;
        const end = `${point.x.toFixed(2)} ${point.y.toFixed(2)}`;
        commands[layerIndex].push(
          `${layerIndex === previousLayer ? "L" : `M${start} L`}${end}`
        );
        previous = point;
        previousLayer = layerIndex;
      }
      return commands.map(bucket => bucket.join(" "));
    }

    function projectWorldPoint(x, y, z) {
      const yaw = state.cameraYaw;
      const pitch = state.cameraPitch;
      const cosYaw = Math.cos(yaw);
      const sinYaw = Math.sin(yaw);
      const cosPitch = Math.cos(pitch);
      const sinPitch = Math.sin(pitch);
      const cosRoll = Math.cos(state.cameraRoll);
      const sinRoll = Math.sin(state.cameraRoll);
      const rotatedX = x * cosYaw - z * sinYaw;
      const rotatedZ = x * sinYaw + z * cosYaw;
      const projectedY = y * cosPitch - rotatedZ * sinPitch;
      const projectedZ = y * sinPitch + rotatedZ * cosPitch;
      const screenX = rotatedX * cosRoll - projectedY * sinRoll;
      const screenY = rotatedX * sinRoll + projectedY * cosRoll;
      const scale = state.cameraDistance / (state.cameraDistance + projectedZ);
      return {
        x: state.layout.centerX + screenX * scale * state.cameraZoom,
        y: state.layout.centerY + screenY * scale * state.cameraZoom,
        z: projectedZ,
        scale
      };
    }

    function getGroupOrbit(group) {
      const semiMajor = state.layout.maxRadius * group.orbitScale;
      const semiMinor = semiMajor * group.flatten;
      return {
        semiMajor,
        semiMinor,
        focusShift: Math.sqrt(Math.max(0, semiMajor * semiMajor - semiMinor * semiMinor)) * group.focusSide,
        orbitTilt: group.tilt * Math.PI / 180,
        inclination: group.inclination * Math.PI / 180
      };
    }

    function orbitPoint(group, angleDegrees) {
      const orbit = getGroupOrbit(group);
      const angle = angleDegrees * Math.PI / 180;
      const major = orbit.focusShift + Math.cos(angle) * orbit.semiMajor;
      const minor = Math.sin(angle) * orbit.semiMinor;
      const planeX = major * Math.cos(orbit.orbitTilt) - minor * Math.sin(orbit.orbitTilt);
      const planeZ = major * Math.sin(orbit.orbitTilt) + minor * Math.cos(orbit.orbitTilt);
      return projectWorldPoint(
        planeX,
        planeZ * Math.sin(orbit.inclination),
        planeZ * Math.cos(orbit.inclination)
      );
    }

    function updateCategoryProjection() {
      if (!state.layout || state.group) return;
      const projectionKey = [
        state.layout.centerX,
        state.layout.centerY,
        state.layout.maxRadius,
        state.cameraYaw,
        state.cameraPitch,
        state.cameraRoll,
        state.cameraZoom
      ].map(value => Number(value).toFixed(4)).join("|");
      const refreshOrbitPaths = state.categoryOrbitProjectionKey !== projectionKey;
      const core = state.categoryNodes.get("core");
      const depthRange = sceneDepthRange(state.layout.maxRadius);
      if (core) {
        const coreDiameter = Number.parseFloat(core.style.getPropertyValue("--diameter"));
        core.style.left = `${state.layout.centerX}px`;
        core.style.top = `${state.layout.centerY}px`;
        core.style.opacity = "1";
        core.style.setProperty("--planet-scale", state.cameraZoom.toFixed(3));
        core.style.setProperty("--planet-span", `${coreDiameter * state.cameraZoom}px`);
        core.style.zIndex = String(depthZIndex(0, depthRange));
      }

      Object.entries(GROUPS).filter(([id]) => id !== "core").forEach(([id, group]) => {
        const node = state.categoryNodes.get(id);
        if (!node) return;
        const currentAngle = group.angle + state.motionTime * group.speed;
        const point = orbitPoint(group, currentAngle);
        node.style.left = `${point.x}px`;
        node.style.top = `${point.y}px`;
        node.style.opacity = String(clamp(1 - (point.z / state.layout.maxRadius) * .17, .76, 1));
        const planetScale = clamp(point.scale * state.cameraZoom, .55, 1.48);
        const planetDiameter = Number.parseFloat(node.style.getPropertyValue("--diameter"));
        node.style.setProperty(
          "--planet-scale",
          planetScale.toFixed(3)
        );
        node.style.setProperty("--planet-span", `${planetDiameter * planetScale}px`);
        node.style.zIndex = String(depthZIndex(point.z, depthRange));
        const orbitPaths = state.categoryOrbitPaths.get(id) || [];
        if (refreshOrbitPaths && orbitPaths.length) {
          const paths = projectedLayeredPaths(
            angle => orbitPoint(group, angle),
            0,
            360,
            140,
            depthRange
          );
          orbitPaths.forEach((path, index) => path.setAttribute("d", paths[index]));
        }
      });
      if (refreshOrbitPaths) {
        state.categoryOrbitProjectionKey = projectionKey;
      }
    }

    function drawScene() {
      if (!state.layout) return;
      const { width, height } = state.layout;
      const sceneLayers = createSceneLayers(width, height);
      state.categoryOrbitProjectionKey = "";

      const starGroup = svgElement("g");
      state.starGroup = starGroup;
      for (let index = 0; index < 186; index += 1) {
        const x = ((index * 97 + 31) % 991) / 991 * width;
        const y = ((index * 61 + 17) % 997) / 997 * height;
        starGroup.appendChild(svgElement("circle", {
          cx: x,
          cy: y,
          r: index % 31 === 0 ? 1.45 : (index % 13 === 0 ? 1.05 : .58),
          class: "star-dot",
          opacity: index % 17 === 0 ? .42 : (index % 7 === 0 ? .27 : .13)
        }));
      }
      sceneLayers[0].appendChild(starGroup);

      if (!state.group) {
        Object.entries(GROUPS).filter(([id]) => id !== "core").forEach(([id, group]) => {
          state.categoryOrbitPaths.set(
            id,
            createLayeredOrbitPaths("category-orbit", "data-orbit", id, group.color)
          );
        });
      }
      updateCategoryProjection();
    }

    function positionCategories() {
      if (!state.layout || state.group) return;
      updateCategoryProjection();
    }

    function openGroup(groupId) {
      state.group = groupId;
      state.groupMotionStart = state.motionTime;
      state.selected = null;
      stage.classList.remove("has-file-selection");
      selectionReset.classList.remove("is-visible");
      state.hovered = null;
      state.paused = false;
      orbitLayer.style.opacity = "0";
      orbitLayer.style.pointerEvents = "none";
      fileLayer.innerHTML = "";
      stage.classList.remove("compact-labels");
      state.fileNodes.clear();
      state.localAngles.clear();
      drawLocalOrbits(groupId);
      sectorTitle.style.setProperty("--sector-color", GROUPS[groupId].color);
      sectorTitle.innerHTML = `
        <span class="sector-planet"><canvas class="planet-canvas" width="220" height="220" aria-hidden="true"></canvas></span>
        <strong>${escapeHtml(GROUPS[groupId].name)}</strong>
        <span class="sector-folder">${escapeHtml(GROUPS[groupId].folder)}</span>
        <small>${FILES_BY_GROUP[groupId].length} 个文件</small>
      `;
      paintPlanet(
        sectorTitle.querySelector("canvas"),
        GROUPS[groupId].color,
        hashSeed(groupId),
        true,
        GROUP_WEIGHT_TOTALS[groupId]
      );
      sectorTitle.classList.add("is-visible");
      buildLocalFiles(groupId);
      updateBreadcrumb();
      updateSectorRail();
      backButton.classList.add("is-visible");
      renderGroupOverview(groupId);
      positionLocalFiles();
    }

    function closeGroup() {
      state.group = null;
      state.selected = null;
      stage.classList.remove("has-file-selection");
      selectionReset.classList.remove("is-visible");
      state.hovered = null;
      state.paused = false;
      orbitLayer.style.opacity = "1";
      orbitLayer.style.pointerEvents = "";
      fileLayer.innerHTML = "";
      state.fileNodes.clear();
      state.localAngles.clear();
      sectorTitle.classList.remove("is-visible");
      backButton.classList.remove("is-visible");
      drawScene();
      updateBreadcrumb();
      updateSectorRail();
      renderOverview();
      positionCategories();
    }

    function getLocalOrbitSpecs(groupId) {
      if (!state.layout) return [];
      const localMax = Math.min(state.layout.width * .4, state.layout.height * .41);
      if (FILES_BY_GROUP[groupId].length > 7) {
        return [
          { radius: localMax * .52, tilt: 0, inclination: 0, speed: .17, baseAngle: -82 },
          { radius: localMax, tilt: 0, inclination: 0, speed: -.12, baseAngle: -58 }
        ];
      }
      return [
        { radius: localMax * .78, tilt: 0, inclination: 0, speed: .14, baseAngle: -84 }
      ];
    }

    function drawLocalOrbits(groupId) {
      if (!state.layout) return;
      drawScene();
      state.localOrbitProjectionKey = "";
      state.localOrbitPaths = getLocalOrbitSpecs(groupId).map((spec, index) => {
        const paths = createLayeredOrbitPaths(
          "local-orbit",
          "data-local-index",
          String(index),
          GROUPS[groupId].color
        );
        paths.forEach(path => path.setAttribute("opacity", index ? ".24" : ".4"));
        return paths;
      });
      const linksGroup = svgElement("g", { id: "linksGroup" });
      state.sceneLayers[0].appendChild(linksGroup);
    }

    function localOrbitPoint(groupId, orbitIndex, angleDegrees) {
      const spec = getLocalOrbitSpecs(groupId)[orbitIndex];
      const radians = angleDegrees * Math.PI / 180;
      const tilt = spec.tilt * Math.PI / 180;
      const inclination = spec.inclination * Math.PI / 180;
      const major = Math.cos(radians) * spec.radius;
      const minor = Math.sin(radians) * spec.radius * .82;
      const planeX = major * Math.cos(tilt) - minor * Math.sin(tilt);
      const planeZ = major * Math.sin(tilt) + minor * Math.cos(tilt);
      return projectWorldPoint(
        planeX,
        planeZ * Math.sin(inclination),
        planeZ * Math.cos(inclination)
      );
    }

    function buildLocalFiles(groupId) {
      const files = FILES_BY_GROUP[groupId];
      const orbitSpecs = getLocalOrbitSpecs(groupId);
      stage.classList.toggle(
        "compact-labels",
        files.length > 8 || (state.layout && state.layout.width < 620)
      );
      const innerCount = orbitSpecs.length > 1 ? Math.ceil(files.length / 2) : 0;
      files.forEach((file, index) => {
        const orbitIndex = index < innerCount ? 0 : (innerCount ? 1 : 0);
        const countInOrbit = orbitIndex === 0
          ? (innerCount || files.length)
          : files.length - innerCount;
        const indexInOrbit = orbitIndex === 0 ? index : index - innerCount;
        const spec = orbitSpecs[orbitIndex];
        const baseAngle = spec.baseAngle +
          (360 / Math.max(countInOrbit, 1)) * indexInOrbit;
        state.localAngles.set(file.path, { orbitIndex, baseAngle, speed: spec.speed });
        const button = document.createElement("button");
        button.type = "button";
        button.className = "file-node";
        button.dataset.path = file.path;
        button.dataset.weight = file.weight.toFixed(2);
        button.style.setProperty("--file-color", file.color);
        const fileDiameter = weightToDiameter(
          file.weight,
          FILE_WEIGHT_MIN,
          FILE_WEIGHT_MAX,
          6,
          12
        );
        button.style.setProperty("--file-size", `${fileDiameter.toFixed(1)}px`);
        button.innerHTML = `
          <span class="node-body">
            <span class="file-sphere" aria-hidden="true">
              <canvas class="planet-canvas" width="64" height="64"></canvas>
            </span>
            <span class="file-name">${escapeHtml(file.name)}</span>
          </span>
        `;
        button.setAttribute("aria-label", `${file.name}，${file.role}`);
        button.addEventListener("pointerenter", () => {
          state.paused = true;
          state.hovered = file.path;
        });
        button.addEventListener("pointerleave", () => {
          state.paused = false;
          state.hovered = null;
        });
        button.addEventListener("focus", () => {
          state.paused = true;
          state.hovered = file.path;
        });
        button.addEventListener("blur", () => {
          state.paused = false;
          state.hovered = null;
        });
        button.addEventListener("click", () => selectFile(file.path));
        fileLayer.appendChild(button);
        paintPlanet(
          button.querySelector("canvas"),
          file.color,
          hashSeed(file.path),
          false,
          file.weight
        );
        state.fileNodes.set(file.path, button);
      });
      requestAnimationFrame(() => {
        state.fileNodes.forEach(node => node.classList.add("is-visible"));
      });
    }

    function positionLocalFiles() {
      if (!state.layout || !state.group) return;
      const localMax = Math.min(state.layout.width * .4, state.layout.height * .41);
      const files = FILES_BY_GROUP[state.group];
      const depthRange = sceneDepthRange(localMax);
      const projectionKey = [
        state.group,
        state.layout.width,
        state.layout.height,
        state.cameraYaw,
        state.cameraPitch,
        state.cameraRoll,
        state.cameraZoom
      ].map(value => Number.isNaN(Number(value)) ? value : Number(value).toFixed(4)).join("|");
      const refreshOrbitPaths = state.localOrbitProjectionKey !== projectionKey;
      sectorTitle.style.setProperty("--sector-scale", state.cameraZoom.toFixed(3));
      sectorTitle.style.zIndex = String(depthZIndex(0, depthRange));
      if (refreshOrbitPaths) {
        state.localOrbitPaths.forEach((orbitPaths, index) => {
          const paths = projectedLayeredPaths(
            angle => localOrbitPoint(state.group, index, angle),
            0,
            360,
            140,
            depthRange
          );
          orbitPaths.forEach((path, layerIndex) => path.setAttribute("d", paths[layerIndex]));
        });
        state.localOrbitProjectionKey = projectionKey;
      }
      files.forEach(file => {
        const node = state.fileNodes.get(file.path);
        const info = state.localAngles.get(file.path);
        if (!node || !info) return;
        const angle = info.baseAngle +
          (state.motionTime - state.groupMotionStart) * info.speed;
        const point = localOrbitPoint(state.group, info.orbitIndex, angle);
        node.style.left = `${point.x}px`;
        node.style.top = `${point.y}px`;
        node.style.opacity = String(clamp(1 - (point.z / localMax) * .18, .76, 1));
        const planetScale = clamp(point.scale * state.cameraZoom, .55, 1.48);
        const planetDiameter = Number.parseFloat(node.style.getPropertyValue("--file-size"));
        node.style.setProperty(
          "--planet-scale",
          planetScale.toFixed(3)
        );
        node.style.setProperty("--planet-span", `${planetDiameter * planetScale}px`);
        node.style.zIndex = String(depthZIndex(point.z, depthRange));
      });
      updateLinks();
    }

    function selectFile(path) {
      const file = FILES_BY_PATH.get(path);
      if (!file) return;
      if (state.group !== file.group) {
        openGroup(file.group);
      }
      state.selected = path;
      state.paused = true;
      state.fileNodes.forEach((node, nodePath) => {
        node.classList.toggle("is-active", nodePath === path);
        node.classList.toggle("is-related", file.related.includes(nodePath));
      });
      stage.classList.add("has-file-selection");
      selectionReset.classList.add("is-visible");
      updateBreadcrumb();
      drawLinksFor(file);
      renderFileDetail(file);
      if (window.matchMedia("(max-width: 900px)").matches) {
        dossier.scrollIntoView({ behavior: state.reducedMotion ? "auto" : "smooth", block: "start" });
      }
    }

    function drawLinksFor(file) {
      const linksGroup = document.getElementById("linksGroup");
      if (!linksGroup) return;
      linksGroup.innerHTML = "";
      const sourceNode = state.fileNodes.get(file.path);
      if (!sourceNode) return;
      file.related.forEach(relatedPath => {
        const targetNode = state.fileNodes.get(relatedPath);
        if (!targetNode) return;
        const link = svgElement("line", { class: "link-line" });
        link.dataset.from = file.path;
        link.dataset.to = relatedPath;
        linksGroup.appendChild(link);
      });
      updateLinks();
    }

    function updateLinks() {
      const linksGroup = document.getElementById("linksGroup");
      if (!linksGroup) return;
      linksGroup.querySelectorAll(".link-line").forEach(line => {
        const fromNode = state.fileNodes.get(line.dataset.from);
        const toNode = state.fileNodes.get(line.dataset.to);
        if (!fromNode || !toNode) return;
        line.setAttribute("x1", parseFloat(fromNode.style.left));
        line.setAttribute("y1", parseFloat(fromNode.style.top));
        line.setAttribute("x2", parseFloat(toNode.style.left));
        line.setAttribute("y2", parseFloat(toNode.style.top));
      });
    }

    function updateBreadcrumb() {
      breadcrumb.innerHTML = "";
      const overviewButton = document.createElement("button");
      overviewButton.type = "button";
      overviewButton.textContent = "总览";
      overviewButton.addEventListener("click", closeGroup);
      breadcrumb.appendChild(overviewButton);

      if (state.group) {
        breadcrumb.appendChild(crumbSeparator());
        const groupButton = document.createElement("button");
        groupButton.type = "button";
        groupButton.textContent = GROUPS[state.group].name;
        groupButton.addEventListener("click", clearFileSelection);
        breadcrumb.appendChild(groupButton);
      }

      if (state.selected) {
        breadcrumb.appendChild(crumbSeparator());
        const selected = document.createElement("span");
        selected.textContent = FILES_BY_PATH.get(state.selected).name;
        breadcrumb.appendChild(selected);
      }
    }

    function clearFileSelection() {
      if (!state.group) return;
      state.selected = null;
      state.paused = false;
      stage.classList.remove("has-file-selection");
      selectionReset.classList.remove("is-visible");
      state.fileNodes.forEach(node => {
        node.classList.remove("is-active", "is-related");
      });
      drawLocalOrbits(state.group);
      renderGroupOverview(state.group);
      updateBreadcrumb();
    }

    function crumbSeparator() {
      const separator = document.createElement("span");
      separator.className = "crumb-separator";
      separator.textContent = "/";
      return separator;
    }

    function renderOverview() {
      dossier.style.setProperty("--panel-accent", GROUPS.core.color);
      dossier.innerHTML = `
        <div class="dossier-inner">
          <div class="dossier-kicker">当前 Git 清单 · Skill 2.7.0</div>
          <h2>文件星球，先看整体结构</h2>
          <p class="dossier-lead">文件星球包含 113 个文件：入口、调用元数据、参考、脚本和测试资料。点击任意分区，让它的文件沿职责轨道展开。</p>
          <div class="overview-list">
            ${Object.entries(GROUPS).sort((a, b) => a[1].ring - b[1].ring).map(([id, group]) => `
              <div class="overview-row" style="--row-color:${group.color}">
                <em>R${group.ring}</em>
                <span><b>${escapeHtml(group.name)}</b><br>${escapeHtml(group.summary)}</span>
                <em>${FILES_BY_GROUP[id].length}</em>
              </div>
            `).join("")}
          </div>
          <p class="overview-note">轨道是按结构关系绘制的示意椭圆，整体以契约核心为视觉中心，部分轨道保留小幅倾角。目录球按该目录的文件权重总和映射大小，文件小球按自身权重映射大小；均不表示文件体积。</p>
        </div>
      `;
    }

    function renderGroupOverview(groupId) {
      const group = GROUPS[groupId];
      const files = FILES_BY_GROUP[groupId];
      dossier.style.setProperty("--panel-accent", group.color);
      dossier.innerHTML = `
        <div class="dossier-inner">
          <div class="dossier-kicker">R${group.ring} · ${escapeHtml(group.folder)}</div>
          <h2>${escapeHtml(group.name)}</h2>
          <p class="dossier-lead">${escapeHtml(group.summary)}</p>
          <div class="group-file-list">
            ${files.map(file => `
              <button class="group-file-row" type="button" data-path="${escapeHtml(file.path)}">
                <span>${escapeHtml(file.name)}</span>
                <span>${escapeHtml(file.role)}</span>
              </button>
            `).join("")}
          </div>
          <p class="overview-note">悬停球体会放大；点击球体或上方列表查看文件职责。</p>
        </div>
      `;
      dossier.querySelectorAll(".group-file-row").forEach(button => {
        button.addEventListener("click", () => selectFile(button.dataset.path));
      });
    }

    function renderFileDetail(file) {
      dossier.style.setProperty("--panel-accent", file.color);
      const relatedButtons = file.related.length
        ? file.related.map(path => {
          const related = FILES_BY_PATH.get(path);
          return related
            ? `<button class="related-link" type="button" data-path="${escapeHtml(path)}">${escapeHtml(related.name)}</button>`
            : "";
        }).join("")
        : `<span style="color:var(--muted);font-size:11px">没有声明直接关联文件</span>`;
      dossier.innerHTML = `
        <div class="dossier-inner">
          <div class="dossier-kicker">${escapeHtml(file.role)}</div>
          <h2>${escapeHtml(file.name)}</h2>
          <p class="dossier-path">${escapeHtml(file.location)}</p>
          <p class="dossier-lead">${escapeHtml(file.what)}</p>
          <section class="detail-block">
            <h3>何时出现</h3>
            <p>${escapeHtml(file.when)}</p>
          </section>
          <section class="detail-block">
            <h3>边界</h3>
            <ul>${file.boundaries.map(boundary => `<li>${escapeHtml(boundary)}</li>`).join("")}</ul>
          </section>
          <section class="detail-block">
            <h3>关联文件</h3>
            <div class="related-list">${relatedButtons}</div>
          </section>
          <ul class="file-meta">
            <li><strong>所属层级</strong><span>R${GROUPS[file.group].ring} · ${escapeHtml(GROUPS[file.group].name)}</span></li>
            <li><strong>文件权重</strong><span>${file.weight.toFixed(2)}</span></li>
            <li><strong>文件类型</strong><span>${fileTypeLabel(file)}</span></li>
            <li><strong>交互状态</strong><span>仅展示说明；不会执行文件</span></li>
          </ul>
        </div>
      `;
      dossier.querySelectorAll(".related-link").forEach(button => {
        button.addEventListener("click", () => selectFile(button.dataset.path));
      });
    }

    function fileTypeLabel(file) {
      if (file.group === "scripts") return "PowerShell / 原生运行辅助";
      if (file.group === "tests") return "自动测试 / 冻结场景";
      if (file.group === "core" && file.path.endsWith(".yaml")) return "界面元数据";
      return "条件加载的规则参考";
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) {
        state.lastTimestamp = timestamp;
      }
      const delta = Math.min((timestamp - state.lastTimestamp) / 1000, .05);
      state.lastTimestamp = timestamp;
      if (!state.reducedMotion) {
        state.planetTime += delta;
      }
      if (state.motionOn && !state.paused) {
        state.motionTime += delta;
      }
      if (state.cameraDrift && !state.paused) {
        state.cameraYaw += delta * .022;
      }
      if (!state.dragging && Math.abs(state.cameraYawVelocity) > .001) {
        state.cameraYaw += state.cameraYawVelocity * delta;
        state.cameraYawVelocity *= Math.exp(-delta * 4.2);
      }
      if (state.starGroup) {
        const starX = Math.sin(state.cameraYaw) * 8;
        const starY = Math.cos(state.cameraPitch) * 3 + Math.sin(state.cameraYaw * .73) * 1.5;
        state.starGroup.setAttribute(
          "transform",
          `translate(${starX.toFixed(2)} ${starY.toFixed(2)})`
        );
      }
      if (state.group) {
        updateCategoryProjection();
        positionLocalFiles();
      } else {
        positionCategories();
      }
      renderVisiblePlanets();
      requestAnimationFrame(frame);
    }

    backButton.addEventListener("click", closeGroup);
    selectionReset.addEventListener("click", clearFileSelection);
    motionToggle.addEventListener("click", () => {
      state.cameraDrift = !state.cameraDrift;
      motionToggle.setAttribute("aria-pressed", String(state.cameraDrift));
      motionToggle.textContent = state.cameraDrift ? "停止视角" : "自动视角";
    });

    function setCameraZoom(value) {
      state.cameraZoom = clamp(value, .72, 1.22);
      cameraZoomLabel.textContent = String(Math.round(state.cameraZoom * 100));
      renderCurrentScene();
    }

    function resetCamera() {
      state.cameraYaw = 0;
      state.cameraPitch = -.5;
      state.cameraRoll = 0;
      state.cameraYawVelocity = 0;
      state.cameraDrift = false;
      motionToggle.setAttribute("aria-pressed", "false");
      motionToggle.textContent = "自动视角";
      setCameraZoom(1);
    }

    zoomIn.addEventListener("click", () => setCameraZoom(state.cameraZoom + .06));
    zoomOut.addEventListener("click", () => setCameraZoom(state.cameraZoom - .06));
    zoomReset.addEventListener("click", resetCamera);

    function renderCurrentScene() {
      if (state.group) {
        positionLocalFiles();
      }
      else {
        updateCategoryProjection();
      }
      if (state.reducedMotion) {
        renderVisiblePlanets(true);
      }
      else {
        state.lastPlanetFrame = 0;
      }
    }

    stage.addEventListener("pointerdown", event => {
      const isRollDrag = event.button === 2 || (event.button === 0 && event.shiftKey);
      if (!isRollDrag && event.button !== 0) return;
      if (event.target.closest("button, nav, .camera-rail")) return;
      state.dragging = true;
      state.paused = true;
      state.cameraYawVelocity = 0;
      state.dragMode = isRollDrag ? "roll" : "orbit";
      state.dragStartX = event.clientX;
      state.dragStartY = event.clientY;
      state.dragStartYaw = state.cameraYaw;
      state.dragStartPitch = state.cameraPitch;
      state.dragStartRoll = state.cameraRoll;
      state.lastDragTimestamp = event.timeStamp;
      stage.classList.add("is-dragging");
      stage.classList.toggle("is-rolling", isRollDrag);
      stage.setPointerCapture(event.pointerId);
    });

    stage.addEventListener("pointermove", event => {
      if (!state.dragging) return;
      if (state.dragMode === "roll") {
        state.cameraRoll = state.dragStartRoll +
          (event.clientX - state.dragStartX) * .004 +
          (event.clientY - state.dragStartY) * .0015;
        renderCurrentScene();
        return;
      }
      const previousYaw = state.cameraYaw;
      state.cameraYaw = state.dragStartYaw + (event.clientX - state.dragStartX) * .0032;
      state.cameraPitch = clamp(
        state.dragStartPitch + (event.clientY - state.dragStartY) * .0032,
        -CAMERA_PITCH_LIMIT,
        CAMERA_PITCH_LIMIT
      );
      const elapsed = Math.max(8, event.timeStamp - state.lastDragTimestamp);
      state.cameraYawVelocity = clamp((state.cameraYaw - previousYaw) / elapsed * 1000, -2.2, 2.2);
      state.lastDragTimestamp = event.timeStamp;
      renderCurrentScene();
    });

    function finishGalaxyDrag(event) {
      if (!state.dragging) return;
      state.dragging = false;
      state.paused = false;
      if (event.timeStamp - state.lastDragTimestamp > 90) {
        state.cameraYawVelocity = 0;
      }
      stage.classList.remove("is-dragging");
      stage.classList.remove("is-rolling");
      if (stage.hasPointerCapture(event.pointerId)) {
        stage.releasePointerCapture(event.pointerId);
      }
    }

    stage.addEventListener("pointerup", finishGalaxyDrag);
    stage.addEventListener("pointercancel", finishGalaxyDrag);
    stage.addEventListener("contextmenu", event => event.preventDefault());
    stage.addEventListener("wheel", event => {
      if (event.target.closest(".camera-rail")) return;
      event.preventDefault();
      setCameraZoom(state.cameraZoom - event.deltaY * .00055);
    }, { passive: false });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (state.selected) {
        clearFileSelection();
      } else if (state.group) {
        closeGroup();
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      measure();
      if (state.group) {
        stage.classList.toggle(
          "compact-labels",
          FILES_BY_GROUP[state.group].length > 8 ||
          (state.layout && state.layout.width < 620)
        );
        drawLocalOrbits(state.group);
        positionLocalFiles();
        if (state.selected) drawLinksFor(FILES_BY_PATH.get(state.selected));
      }
    });
    resizeObserver.observe(stage);

    if (state.reducedMotion) {
      state.cameraDrift = false;
      motionToggle.setAttribute("aria-pressed", "false");
      motionToggle.textContent = "自动视角";
    }

    createOverview();
    updateBreadcrumb();
    renderOverview();
    measure();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
