      const lifecycleStateEvents = [
        {

      const triageStateOrder = [&quot;scope&quot;, &quot;evidence&quot;, &quot;action&quot;, &quot;handoff&quot;];

      function renderStateRail(container, states, activeId, options = {}) {
        const activeIndex = states.findIndex(state =&gt; state.id === activeId);
        const dangerIndex = states.findIndex(state =&gt; state.id === options.dangerId);
        const blockedIds = new Set(options.blockedIds || []);
        container.replaceChildren();

        states.forEach((state, index) =&gt; {
          const item = document.createElement(&quot;li&quot;);
          item.className = &quot;dse-state-node&quot;;
          const isActive = state.id === activeId;
          const isDanger = state.id === options.dangerId;
          const isWarning = state.id === options.warningId;
          const isBlocked = blockedIds.has(state.id) ||
            (dangerIndex &gt;= 0 &amp;&amp; index &gt; dangerIndex) ||
            (options.sequential === false &amp;&amp; !isActive);

          if (options.sequential !== false &amp;&amp; activeIndex &gt;= 0 &amp;&amp; index &lt; activeIndex) {
            item.classList.add(&quot;is-done&quot;);
          }
          if (isActive) item.classList.add(&quot;is-current&quot;);
          if (isDanger) item.classList.add(&quot;is-danger&quot;);
          if (isWarning) item.classList.add(&quot;is-warning&quot;);
          if (isBlocked &amp;&amp; !isDanger) item.classList.add(&quot;is-blocked&quot;);
          if (options.readyId === state.id) item.classList.add(&quot;is-ready&quot;);
          if (isActive) item.setAttribute(&quot;aria-current&quot;, &quot;step&quot;);

          const code = document.createElement(&quot;span&quot;);
          code.className = &quot;dse-state-code&quot;;
          code.textContent = state.code;
          const name = document.createElement(&quot;span&quot;);
          name.className = &quot;dse-state-name&quot;;
          name.textContent = state.name;
          const meta = document.createElement(&quot;span&quot;);
          meta.className = &quot;dse-state-meta&quot;;
          meta.textContent = options.meta?.[state.id] || &quot;&quot;;
          item.append(code, name, meta);
          container.appendChild(item);
        });
      }

      function setTuneState(stateId, options = {}) {
        const copy = options.copy || tuneStateCopy[stateId] || tuneStateCopy.input;
        activeTuneState = stateId;
        tuneStateLabel.textContent = options.label || copy.label;
        tuneStateNext.textContent = options.next || copy.next;
        renderStateRail(tuneStateRail, tuneStates, stateId, {
          dangerId: options.danger ? stateId : &quot;&quot;,
          warningId: options.warning ? stateId : &quot;&quot;,
          meta: options.meta

        enterExperimentButton.disabled = !(tuneGateReady &amp;&amp; stateId === &quot;eligible&quot;);

      function setExperimentState(stateId, options = {}) {
        activeExperimentState = stateId;
        const copy = options.copy || experimentStateCopy[stateId] || {
          label: &quot;STATE / WAITING GATE&quot;,
          next: &quot;先完成上方五项证据检查。&quot;

        experimentStateLabel.textContent = options.label || copy.label;
        experimentStateNext.textContent = options.next || copy.next;

          dangerId: options.dangerId,
          warningId: options.warningId,
          readyId: options.readyId,
          meta: options.meta

      function resetExperimentState(reason = &quot;WAITING GATE&quot;) {
        activeExperimentState = &quot;&quot;;
        generateExperimentButton.disabled = true;
        experimentStateLabel.textContent = `STATE / ${reason}`;
        experimentStateNext.textContent = &quot;先完成上方五项证据检查。&quot;;

        simActions.hidden = true;
        simOutcome.hidden = true;
        expGrid.replaceChildren();
        renderStateRail(experimentStateRail, experimentStates, &quot;&quot;);

      function renderTriageState() {
        const triageCase = triageCases[activeTriageCase];
        const stageId = triageStateOrder[triageStageIndex];
        const stage = triageCase.stages[stageId];
        const isDanger = Boolean(triageCase.danger);
        const blockedIds = isDanger
          ? triageStateOrder.filter(id =&gt; id !== &quot;scope&quot;)
          : [];
        renderStateRail(triageStateRail, triageStates, stageId, {
          dangerId: isDanger ? &quot;scope&quot; : &quot;&quot;,
          blockedIds,
          meta: {
            intake: activeTriageCase.toUpperCase(),
            [stageId]: `${triageStageIndex + 1}/${triageStateOrder.length}`
          }
        });
        triageStateLabel.textContent = isDanger ? &quot;STATE / HARD-STOP&quot; : `STATE / ${stageId.toUpperCase()}`;
        triageStateNext.textContent = isDanger
          ? &quot;物理危险优先，不进入后续检查。&quot;
          : triageStageIndex &gt;= triageStateOrder.length - 1
            ? &quot;已达到分流终点。&quot;
            : &quot;推进下一步时，只增加一个新证据或一个可逆动作。&quot;;
        triageCopy.dataset.tone = stage.tone;
        triageCopyTitle.textContent = stage.title;
        triageCopyBody.textContent = stage.body;
        triageAdvanceButton.disabled = isDanger || triageStageIndex &gt;= triageStateOrder.length - 1;
        triageAdvanceButton.textContent = isDanger || triageStageIndex &gt;= triageStateOrder.length - 1
          ? &quot;已到状态终点&quot;
          : triageStageIndex === 0
            ? &quot;补充当前证据&quot;
            : triageStageIndex === 1
              ? &quot;执行最小检查&quot;
              : &quot;形成分流结论&quot;;
        triageCaseGrid.querySelectorAll(&quot;[data-triage-case]&quot;).forEach(button =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.triageCase === activeTriageCase));
        });
      }

      function selectTriageCase(id) {
        if (!triageCases[id]) return;
        activeTriageCase = id;
        triageStageIndex = 0;
        renderTriageState();
      }

      function renderTriageCases() {
        triageCaseGrid.replaceChildren();
        Object.entries(triageCases).forEach(([id, triageCase]) =&gt; {
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;dse-scenario&quot;;
          button.dataset.triageCase = id;
          button.setAttribute(&quot;aria-pressed&quot;, String(id === activeTriageCase));
          button.textContent = triageCase.request;
          button.addEventListener(&quot;click&quot;, () =&gt; selectTriageCase(id));
          triageCaseGrid.appendChild(button);
        });
      }

      function setLifecycleEvent(eventId) {
        const event = lifecycleStateEvents.find(item =&gt; item.id === eventId);
        if (!event) return;
        activeLifecycleEvent = eventId;
        renderStateRail(identityStateRail, identityStates, event.identity, {
          sequential: false,
          dangerId: event.identity === &quot;conflict&quot; ? &quot;conflict&quot; : &quot;&quot;,
          warningId: event.identity === &quot;reported&quot; ? &quot;reported&quot; : &quot;&quot;,
          readyId: event.identity === &quot;confirmed&quot; ? &quot;confirmed&quot; : &quot;&quot;
        });
        renderStateRail(baselineStateRail, baselineStates, event.baseline, {
          sequential: false,
          dangerId: event.baseline === &quot;historical&quot; ? &quot;historical&quot; : &quot;&quot;,
          warningId: event.baseline === &quot;stale&quot; ? &quot;stale&quot; : &quot;&quot;,
          readyId: event.baseline === &quot;current&quot; ? &quot;current&quot; : &quot;&quot;
        });
        lifecycleCopy.dataset.tone = event.tone;
        lifecycleCopyTitle.textContent = event.title;
        lifecycleCopyBody.textContent = event.body;
        lifecycleEvents.querySelectorAll(&quot;[data-lifecycle-event]&quot;).forEach(button =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.lifecycleEvent === eventId));
        });

        const scenario = demoScenarios[id];
        if (!scenario) return;
        activeScenario = id;
        root.querySelectorAll(&quot;[data-scenario]&quot;).forEach(button =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.scenario === id));
        });
        gateRequest.textContent = `&gt; ${scenario.request}`;
        compareDirect.textContent = scenario.direct;
        compareSafe.textContent = scenario.safe;
        gateChecklist.hidden = true;
        gateRules.hidden = true;
        root.querySelectorAll(&quot;[data-gate-check]&quot;).forEach(input =&gt; {
          input.checked = false;
        });
        const checkButton = root.querySelector(&#x27;[data-gate-action=&quot;check&quot;]&#x27;);
        checkButton.disabled = !scenario.canCheck;
        checkButton.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
        checkButton.textContent = &quot;展开五项检查&quot;;
        tuneGateReady = false;
        enterExperimentButton.disabled = true;
        renderCompareAudit(scenario.tone === &quot;stop&quot;);
        setTuneState(&quot;classify&quot;, {
          danger: scenario.tone === &quot;stop&quot;,
          label: scenario.tone === &quot;stop&quot; ? &quot;STATE / HARD-STOP&quot; : &quot;STATE / CLASSIFY&quot;,
          next: scenario.tone === &quot;stop&quot;
            ? &quot;物理危险优先；不进入证据门禁或实验。&quot;
            : &quot;请求已分类；先补齐安全门禁需要的证据。&quot;
        });
        resetExperimentState(scenario.tone === &quot;stop&quot; ? &quot;HARD-STOP&quot; : &quot;WAITING GATE&quot;);
        setGateOutput(scenario.tone, scenario.title, scenario.copy, scenario.missing);
      }

      const scenarioIds = Object.keys(demoScenarios);
      let scenarioCursor = 1;

      function visibleScenarioIds() {
        const ids = [activeScenario];
        let cursor = scenarioCursor;
        while (ids.length &lt; 3) {
          const id = scenarioIds[cursor % scenarioIds.length];
          if (!ids.includes(id)) ids.push(id);
          cursor += 1;
        }
        return ids;
      }

      function renderScenarioButtons() {
        scenarioGrid.replaceChildren();
        visibleScenarioIds().forEach(id =&gt; {
          const scenario = demoScenarios[id];
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;dse-scenario&quot;;
          button.dataset.scenario = id;
          button.setAttribute(&quot;aria-pressed&quot;, String(id === activeScenario));
          button.textContent = scenario.request;
          button.addEventListener(&quot;click&quot;, () =&gt; renderScenario(id));
          scenarioGrid.appendChild(button);
        });
      }

      function rotateScenarioWindow() {
        scenarioCursor = (scenarioCursor + 2) % scenarioIds.length;
        renderScenarioButtons();
      }

      root.querySelector(&quot;[data-scenario-rotate]&quot;).addEventListener(&quot;click&quot;, rotateScenarioWindow);
      window.setInterval(() =&gt; {
        if (!document.hidden &amp;&amp; !demoSection.hidden) rotateScenarioWindow();
      }, 12000);

      root.querySelectorAll(&quot;[data-gate-action]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const scenario = demoScenarios[activeScenario];
          if (button.dataset.gateAction === &quot;direct&quot;) {
            if (scenario.tone === &quot;stop&quot;) {
              tuneGateReady = false;
              enterExperimentButton.disabled = true;
              setTuneState(&quot;classify&quot;, {
                danger: true,
                label: &quot;STATE / HARD-STOP&quot;,
                next: &quot;停止运行；不通过继续压测来确认物理危险。&quot;
              });
              resetExperimentState(&quot;HARD-STOP&quot;);
              setGateOutput(&quot;stop&quot;, &quot;HARD-STOP / 参数请求被拒绝&quot;, &quot;设备存在疑似物理危险时，不会通过继续压测或提供参数来“确认问题”。&quot;);
            } else {
              tuneGateReady = false;
              enterExperimentButton.disabled = true;
              setTuneState(&quot;classify&quot;, {
                label: &quot;STATE / BLOCKED&quot;,
                next: &quot;直接请求参数不会跳过证据门禁；先展开检查。&quot;
              });
              resetExperimentState(&quot;BLOCKED&quot;);
              setGateOutput(&quot;blocked&quot;, &quot;BLOCKED / NO VALUES DISPLAYED&quot;, &quot;当前页面不会生成电压、频率、功耗或时序候选。请先补齐缺失证据。&quot;, scenario.missing);
            }
            return;
          }
          if (button.dataset.gateAction === &quot;check&quot;) {
            if (!scenario.canCheck) {
              tuneGateReady = false;
              enterExperimentButton.disabled = true;
              setTuneState(&quot;classify&quot;, {
                danger: true,
                label: &quot;STATE / HARD-STOP&quot;,
                next: &quot;物理危险优先；不允许进入常规五项检查。&quot;
              });
              setGateOutput(&quot;stop&quot;, &quot;HARD-STOP / 不允许进入安全检查&quot;, &quot;先处理可能的供电、电池、线缆或接头危险；不继续运行设备。&quot;);
              return;
            }
            gateRules.hidden = true;
            if (!gateChecklist.hidden) {
              gateChecklist.hidden = true;
              button.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
              button.textContent = &quot;展开五项检查&quot;;
              if (!tuneGateReady) {
                const inputs = [...root.querySelectorAll(&quot;[data-gate-check]&quot;)];
                const done = inputs.filter(item =&gt; item.checked).length;
                setTuneState(&quot;gate&quot;, {
                  meta: { gate: `${done}/${inputs.length}` },
                  next: &quot;检查已收起，已完成的证据选择仍保留。&quot;
                });
              }
              return;
            }
            gateChecklist.hidden = false;
            button.setAttribute(&quot;aria-expanded&quot;, &quot;true&quot;);
            button.textContent = &quot;收起五项检查&quot;;
            const inputs = [...root.querySelectorAll(&quot;[data-gate-check]&quot;)];
            const done = inputs.filter(item =&gt; item.checked).length;
            tuneGateReady = done === inputs.length;
            setTuneState(tuneGateReady ? &quot;eligible&quot; : &quot;gate&quot;, {
              meta: { gate: `${done}/${inputs.length}` },
              next: tuneGateReady
                ? &quot;证据齐全；只解锁演示实验，不代表参数安全。&quot;
                : &quot;逐项确认证据；勾选代表已经拿到证据。&quot;
            });
            if (tuneGateReady) {
              setGateOutput(&quot;ready&quot;, &quot;ELIGIBLE FOR EXPERIMENT / 5 of 5&quot;, &quot;五项证据齐全，只代表可以开始设计实验，不代表任何参数安全或稳定。本页仍不会生成或执行硬件设置。&quot;);
            } else {
              setGateOutput(&quot;blocked&quot;, `TUNING GATE / ${done} of 5`, `已完成 ${done}/5。勾选表示已经拿到对应证据，而不是“我觉得知道”；其余项目完成前不显示候选。`, scenario.missing);
            }
            return;
          }
          gateRules.hidden = !gateRules.hidden;
        });
      });

      root.querySelectorAll(&quot;[data-gate-check]&quot;).forEach(input =&gt; {
        input.addEventListener(&quot;change&quot;, () =&gt; {
          if (!demoScenarios[activeScenario].canCheck) return;
          const inputs = [...root.querySelectorAll(&quot;[data-gate-check]&quot;)];
          const done = inputs.filter(item =&gt; item.checked).length;
          if (done === inputs.length) {
            tuneGateReady = true;
            setTuneState(&quot;eligible&quot;, {
              meta: { gate: &quot;5/5&quot; },
              next: &quot;证据齐全；只解锁演示实验，不代表任何硬件参数安全。&quot;
            });
            setGateOutput(&quot;ready&quot;, &quot;ELIGIBLE FOR EXPERIMENT / 5 of 5&quot;, &quot;五项证据齐全，只代表可以开始设计实验，不代表任何参数安全或稳定。本页仍不会生成或执行硬件设置。&quot;);
          } else {
            tuneGateReady = false;
            enterExperimentButton.disabled = true;
            resetExperimentState(&quot;GATE INCOMPLETE&quot;);
            setTuneState(&quot;gate&quot;, {
              meta: { gate: `${done}/5` },
              next: &quot;补全剩余证据；门禁不会因为口头保证自动放行。&quot;
            });
            setGateOutput(&quot;blocked&quot;, `TUNING GATE / ${done} of 5`, `已完成 ${done}/5。勾选表示已经拿到对应证据，而不是“我觉得知道”；其余项目完成前不显示候选。`);

      function syncExperimentReadiness() {
        if (!tuneGateReady) {
          generateExperimentButton.disabled = true;
          return;
        }
        const missing = [];
        if (demoBaseline.value !== &quot;yes&quot;) missing.push(&quot;当前基线&quot;);
        if (demoRecovery.value !== &quot;yes&quot;) missing.push(&quot;恢复路径&quot;);
        if (missing.length) {
          generateExperimentButton.disabled = true;
          setExperimentState(&quot;baseline&quot;, {
            warningId: &quot;baseline&quot;,
            meta: { baseline: &quot;MISSING&quot; },
            next: `缺少：${missing.join(&quot;、&quot;)}。补齐前不能形成候选。`
          });
          return;
        }
        generateExperimentButton.disabled = false;
        setExperimentState(&quot;candidate&quot;, {
          meta: { baseline: &quot;READY&quot;, candidate: &quot;PENDING&quot; },
          next: &quot;点击生成演示实验卡；本页仍不会产生可套用数值。&quot;
        });
      }

      enterExperimentButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (!tuneGateReady) return;
        setTuneState(&quot;measure&quot;, {
          meta: { gate: &quot;5/5&quot;, measure: &quot;READY&quot; },
          next: &quot;进入实验状态机；先确认基线，再形成单一变量候选。&quot;
        });
        enterExperimentButton.disabled = true;
        syncExperimentReadiness();
        const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
        document.getElementById(&quot;dse-experiment-demo-title&quot;).scrollIntoView({

          block: &quot;start&quot;
        });

      root.querySelectorAll(&quot;.dse-demo-field select&quot;).forEach(select =&gt; {
        select.addEventListener(&quot;change&quot;, () =&gt; {
          experimentOutput.hidden = true;
          expGrid.replaceChildren();
          simActions.hidden = true;
          simOutcome.hidden = true;
          if (tuneGateReady) syncExperimentReadiness();
        });
      });

      function createExpItem(label, value) {
        const item = document.createElement(&quot;div&quot;);
        item.className = &quot;dse-exp-item&quot;;
        const labelNode = document.createElement(&quot;p&quot;);
        labelNode.className = &quot;dse-exp-label&quot;;
        labelNode.textContent = label;
        const valueNode = document.createElement(&quot;p&quot;);
        valueNode.className = &quot;dse-exp-value&quot;;
        valueNode.textContent = value;
        item.append(labelNode, valueNode);
        return item;
      }

      generateExperimentButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (!tuneGateReady) return;
        const goal = document.getElementById(&quot;dse-demo-goal&quot;).value;
        const component = document.getElementById(&quot;dse-demo-component&quot;).value;
        const workload = document.getElementById(&quot;dse-demo-workload&quot;).value;
        const route = document.getElementById(&quot;dse-demo-route&quot;).value;
        const baseline = document.getElementById(&quot;dse-demo-baseline&quot;).value;
        const recovery = document.getElementById(&quot;dse-demo-recovery&quot;).value;
        const missing = [];
        if (baseline !== &quot;yes&quot;) missing.push(&quot;当前基线&quot;);
        if (recovery !== &quot;yes&quot;) missing.push(&quot;恢复路径&quot;);
        experimentOutput.hidden = false;
        expGrid.replaceChildren();
        simActions.hidden = true;
        simOutcome.hidden = true;
        if (missing.length) {
          experimentOutput.className = &quot;dse-experiment-output blocked&quot;;
          expStatus.textContent = &quot;BLOCKED CARD · MISSING EVIDENCE&quot;;
          expTitle.textContent = &quot;暂不生成实验候选&quot;;
          setExperimentState(&quot;baseline&quot;, {
            warningId: &quot;baseline&quot;,
            meta: { baseline: &quot;MISSING&quot; },
            next: `缺少：${missing.join(&quot;、&quot;)}。补齐后再形成候选。`
          });
          expGrid.append(
            createExpItem(&quot;缺少条件&quot;, missing.join(&quot;、&quot;)),
            createExpItem(&quot;安全下一步&quot;, &quot;记录当前配置并建立一个明确的原厂/已知良好恢复点。&quot;),
            createExpItem(&quot;硬件操作&quot;, &quot;NONE&quot;)
          );
          return;
        }
        experimentOutput.className = &quot;dse-experiment-output demo&quot;;
        expStatus.textContent = &quot;DEMO EXPERIMENT CARD · SIMULATION ONLY&quot;;
        expTitle.textContent = `${goal} / ${component}`;
        generateExperimentButton.disabled = true;
        setExperimentState(&quot;measure&quot;, {
          meta: { candidate: &quot;DEMO ONLY&quot;, measure: &quot;RUNNING&quot; },
          next: &quot;记录同负载结果；通过、失败或无法判断必须分开。&quot;
        });
        setTuneState(&quot;measure&quot;, {
          meta: { gate: &quot;5/5&quot;, measure: &quot;RUNNING&quot; },
          next: &quot;演示实验运行中；页面仍未读取或修改任何硬件。&quot;
        });
        enterExperimentButton.disabled = true;
        expGrid.append(
          createExpItem(&quot;唯一变量&quot;, `${route}（只改变这一类控制）`),
          createExpItem(&quot;固定负载&quot;, workload),
          createExpItem(&quot;候选来源&quot;, &quot;使用用户实测工作点；本页不生成具体数值&quot;),
          createExpItem(&quot;通过条件&quot;, &quot;相对基线出现超过噪声的收益，且无异常降频、伪影、驱动重置或温度异常&quot;),
          createExpItem(&quot;中止信号&quot;, &quot;黑屏、花屏、驱动重置、崩溃、异常功耗/温度或性能持续下降&quot;),
          createExpItem(&quot;回退方式&quot;, &quot;恢复到已保存的已知良好配置，并在重启后复核&quot;),
          createExpItem(&quot;证据边界&quot;, &quot;本卡由演示输入生成，未读取硬件，也不能证明稳定&quot;),
          createExpItem(&quot;安全提示&quot;, &quot;参数仅供参考，请以安全为第一要务。NONE&quot;)
        );
        simActions.hidden = false;
      });

      root.querySelectorAll(&quot;[data-sim-result]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          if (button.dataset.simResult === &quot;pass&quot;) {
            simOutcome.className = &quot;dse-sim-outcome&quot;;
            simOutcome.textContent = &quot;SIMULATED PASS → KEEP：本轮结果可保留，但仍需重启、睡眠唤醒和日常使用验证。&quot;;
            setExperimentState(&quot;decision&quot;, {
              readyId: &quot;decision&quot;,
              label: &quot;STATE / KEEP&quot;,
              next: &quot;保留本轮通过值，并继续重启、唤醒和日常使用验证。&quot;,
              meta: { outcome: &quot;PASS&quot;, decision: &quot;KEEP&quot; }
            });
            setTuneState(&quot;outcome&quot;, {
              warning: false,
              label: &quot;STATE / KEEP&quot;,
              next: &quot;本轮通过；仍需日常稳定性验证。&quot;,
              meta: { outcome: &quot;PASS&quot; }
            });
          } else if (button.dataset.simResult === &quot;fail&quot;) {
            simOutcome.className = &quot;dse-sim-outcome fail&quot;;
            simOutcome.textContent = &quot;SIMULATED FAIL → REVERT：恢复上一已通过配置，并检查中止信号。&quot;;
            setExperimentState(&quot;decision&quot;, {
              warningId: &quot;decision&quot;,
              label: &quot;STATE / REVERT&quot;,
              next: &quot;恢复上一已知良好配置，并检查触发失败的因素。&quot;,
              meta: { outcome: &quot;FAIL&quot;, decision: &quot;REVERT&quot; }
            });
            setTuneState(&quot;outcome&quot;, {
              warning: true,
              label: &quot;STATE / REVERT&quot;,
              next: &quot;本轮失败；先回退，不叠加第二个变量。&quot;,
              meta: { outcome: &quot;FAIL&quot; }
            });
          } else {
            simOutcome.className = &quot;dse-sim-outcome inconclusive&quot;;
            simOutcome.textContent = &quot;SIMULATED INCONCLUSIVE → REPEAT：重复同一负载，不增加第二个变量。&quot;;
            setExperimentState(&quot;decision&quot;, {
              warningId: &quot;decision&quot;,
              label: &quot;STATE / REPEAT&quot;,
              next: &quot;保持同一候选与负载，重复一次观测。&quot;,
              meta: { outcome: &quot;INCONCLUSIVE&quot;, decision: &quot;REPEAT&quot; }
            });
            setTuneState(&quot;outcome&quot;, {
              warning: true,
              label: &quot;STATE / REPEAT&quot;,
              next: &quot;证据不足以下结论；重复同条件，不增加新变量。&quot;,
              meta: { outcome: &quot;INCONCLUSIVE&quot; }
            });
          }
          simOutcome.hidden = false;
        });
      });

      triageAdvanceButton.addEventListener(&quot;click&quot;, () =&gt; {
        const triageCase = triageCases[activeTriageCase];
        if (triageCase.danger || triageStageIndex &gt;= triageStateOrder.length - 1) return;
        triageStageIndex += 1;
        renderTriageState();
      });

      triageResetButton.addEventListener(&quot;click&quot;, () =&gt; {
        triageStageIndex = 0;
        renderTriageState();
      });

      renderTriageCases();
      renderTriageState();
      renderLifecycleEvents();
      setLifecycleEvent(&quot;confirm&quot;);
      renderScenarioButtons();
      renderScenario(&quot;cpu&quot;);

      function moveFloatingPanels(left, top, sourcePanel) {
        const width = sourcePanel.getBoundingClientRect().width;
        const height = Math.min(
          sourcePanel.getBoundingClientRect().height,
          window.innerHeight - 16
        );
        const safeLeft = Math.max(8, Math.min(left, window.innerWidth - width - 8));
        const safeTop = Math.max(8, Math.min(top, window.innerHeight - height - 8));
        [milestoneDetail, versionDetail].forEach(panel =&gt; {
          panel.style.left = `${safeLeft}px`;
          panel.style.top = `${safeTop}px`;
          panel.style.right = &quot;auto&quot;;
          panel.style.bottom = &quot;auto&quot;;
        });
      }

      [milestoneDetail, versionDetail].forEach(panel =&gt; {
        const handle = panel.querySelector(&quot;[data-drag-handle]&quot;);
        if (!handle) return;
        let drag = null;
        handle.addEventListener(&quot;pointerdown&quot;, event =&gt; {
          if (window.matchMedia(&quot;(max-width: 580px)&quot;).matches) return;
          if (event.target.closest(&quot;button&quot;)) return;
          const rect = panel.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            offsetX: event.clientX - rect.left,
            offsetY: event.clientY - rect.top
          };
          handle.setPointerCapture(event.pointerId);
          event.preventDefault();
        });
        handle.addEventListener(&quot;pointermove&quot;, event =&gt; {
          if (!drag || drag.pointerId !== event.pointerId) return;
          moveFloatingPanels(event.clientX - drag.offsetX, event.clientY - drag.offsetY, panel);
        });
        const endDrag = event =&gt; {
          if (drag &amp;&amp; drag.pointerId === event.pointerId) drag = null;
        };
        handle.addEventListener(&quot;pointerup&quot;, endDrag);
        handle.addEventListener(&quot;pointercancel&quot;, endDrag);
      });

      function applyFilter(filter, resetScroll = false) {
        root.querySelectorAll(&quot;.dse-filter&quot;).forEach(button =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.filter === filter));
        });
        const demoMode = filter === &quot;demo&quot;;
        mapStage.hidden = demoMode;
        demoSection.hidden = !demoMode;
        root.querySelectorAll(&quot;.dse-track&quot;).forEach(track =&gt; {
          track.hidden = track.dataset.track !== filter;
        });
        root.querySelectorAll(&quot;.dse-series&quot;).forEach(series =&gt; {
          series.hidden = series.dataset.track !== filter;
        });
        convergenceSection.hidden = filter !== &quot;merge&quot;;
        archiveSection.hidden = filter !== &quot;core&quot; &amp;&amp; filter !== &quot;prototype&quot;;
        if (demoMode) {
          hideInspector(false);
          if (termDetail.hidden) startTermRotationTimer();
        } else {
          if (!termDetail.hidden) closeTerm(false);
          pauseTermRotation();
          selectMilestone(lastMilestoneByTrack[filter]);
        }
        if (resetScroll) {
          const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
          root.scrollTo({ top: 0, behavior: reduceMotion ? &quot;auto&quot; : &quot;smooth&quot; });
        }
      }

      root.querySelectorAll(&quot;.dse-filter&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; applyFilter(button.dataset.filter, true));
      });
      mergeButtons.forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; selectMilestone(button.dataset.mergeId, true));
      });
      initTermLab();
      applyFilter(&quot;core&quot;);
      selectVersion(&quot;wb-1-4-4&quot;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }

    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
